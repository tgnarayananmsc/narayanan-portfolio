<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Request | T G Narayanan</title><link rel="stylesheet" href="static/style.css"></head><body><nav class="nav"><a class="brand" href="index.html">TGN<span>.</span></a><div class="navlinks"><a href="index.html#about">About</a><a href="index.html#projects">Projects</a><a href="gallery.html">Gallery</a><a href="resume.html">Resume</a></div></nav><main class="wrap section"><span class="tag">PROJECT ENQUIRY</span><h1>Tell me about your project</h1><p class="muted">This form opens your email app with the details filled in. It does not submit data to a server.</p><form id="project-form" class="glass"><label>Name</label><input name="name" required placeholder="Your name"><label>Email</label><input name="email" type="email" placeholder="you@example.com"><label>Project type</label><input name="type" placeholder="Robotics / IoT / Embedded systems"><label>Budget</label><input name="budget" placeholder="Optional"><label>Expected timeline</label><input name="deadline" placeholder="Optional"><label>Requirements</label><textarea name="requirements" required rows="5" placeholder="Describe your project idea"></textarea><button class="btn primary" type="submit">Prepare email ↗</button></form><p><a class="btn" href="index.html">← Back to portfolio</a></p></main><footer><div class="wrap"><span>© <span data-current-year></span> T G Narayanan.</span></div></footer><script src="static/script.js"></script><script>document.getElementById('project-form').addEventListener('submit',function(e){e.preventDefault();const f=new FormData(this);const body=['Name: '+f.get('name'),'Email: '+f.get('email'),'Project type: '+f.get('type'),'Budget: '+f.get('budget'),'Timeline: '+f.get('deadline'),'','Requirements:',f.get('requirements')].join('\n');location.href='mailto:tgnarayananmsc@gmail.com?subject='+encodeURIComponent('Portfolio project enquiry from '+f.get('name'))+'&body='+encodeURIComponent(body);});</script></body></html>
