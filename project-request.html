<div class="form-wrap"><span class="tag">PROJECT REQUEST</span><h1 style="font-size:clamp(2rem,5vw,3rem)">Tell me about <span class="grad">your project</span></h1>
<p class="lead">Fill in the details below. Your request reaches my inbox directly and I will reply to the email you provide.</p>
<form id="projectForm" class="glass" novalidate>
<input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">
<div class="row"><label>Your name *<input name="name" required placeholder="Full name"></label><label>Your email *<input name="email" type="email" required placeholder="you@example.com"></label></div>
<div class="row"><label>Phone / WhatsApp<input name="phone" type="tel" placeholder="+91 ..."></label>
<label>Project type *<select name="type" required><option value="">Select…</option><option>Robotics</option><option>Embedded Systems</option><option>IoT</option><option>Computer Science / Software</option><option>Academic / Final-Year Project</option><option>STEM Training</option><option>Other</option></select></label></div>
<div class="row"><label>Budget (optional)<input name="budget" placeholder="e.g. ₹5,000 – ₹10,000"></label><label>Expected timeline<input name="timeline" placeholder="e.g. 2 weeks"></label></div>
<label>Project requirements *<textarea name="requirements" required placeholder="Describe features, components, goals..."></textarea></label>
<div id="formMsg" class="msg" role="status"></div>
<button class="btn pri" type="submit">Send project request ↗</button></form></div>
<footer>© <script>document.write(new Date().getFullYear())</script> T G Narayanan.</footer>
